name: CI - Build & Test (Windows)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Build Release solution
        run: msbuild src/Toolbox.sln /m /p:Configuration="Release" /p:Platform="Win32"

  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Build Tests solution
        run: msbuild src/Toolbox.sln /m /p:Configuration="Tests" /p:Platform="Win32"
      - name: Run tests
        shell: pwsh
        run: |
          & "tests/Debug/Tests.exe" --exit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
